<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Inventario</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>Inventario</h1>

    <p id="mensaje" hidden></p>

    <form id="form">
      <input id="input-nombre" placeholder="Nombre" required>
      <input id="input-precio" type="number" step="0.01" min="0.01" placeholder="Precio" required>
      <input id="input-stock" type="number" min="0" step="1" placeholder="Stock" required>
      <button type="submit" id="btn-guardar">Agregar</button>
      <button type="button" id="btn-cancelar" hidden>Cancelar</button>
    </form>

    <input id="buscar" type="search" placeholder="Buscar por nombre...">

    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>Nombre</th>
          <th>Precio</th>
          <th>Stock</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody id="tabla"></tbody>
    </table>

    <p id="vacio" hidden>No hay productos para mostrar.</p>
  </main>

  <script src="app.js"></script>
</body>
</html>
